
name: Build Daniel Hills for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          Invoke-WebRequest "$base/Godot_v4.4.1-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot-package -Force

          $godotFile = Get-ChildItem godot-package -Recurse -File |
            Where-Object { $_.Name -eq "Godot_v4.4.1-stable_win64.exe" } |
            Select-Object -First 1

          if (-not $godotFile) {
            throw "Godot executable not found."
          }

          Copy-Item $godotFile.FullName "./godot.exe" -Force

      - name: Install Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://github.com/godotengine/godot/releases/download/4.4.1-stable"

          Invoke-WebRequest "$base/Godot_v4.4.1-stable_export_templates.tpz" -OutFile templates.tpz
          Copy-Item templates.tpz templates.zip -Force
          Expand-Archive templates.zip -DestinationPath templates-package -Force

          $releaseTemplate = Get-ChildItem templates-package -Recurse -File |
            Where-Object { $_.Name -eq "windows_release_x86_64.exe" } |
            Select-Object -First 1

          if (-not $releaseTemplate) {
            throw "Windows release export template was not found."
          }

          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\4.4.1.stable"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item "$($releaseTemplate.DirectoryName)\*" $templateDir -Recurse -Force

          if (-not (Test-Path "$templateDir\windows_release_x86_64.exe")) {
            throw "Windows export template installation failed."
          }

      - name: Prepare project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "project.godot",
            "scenes/main.tscn",
            "scripts/main.gd",
            "scripts/player.gd"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required project file is missing: $file"
            }
          }

          @'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/DanielHills.exe"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=false
          binary_format/architecture="x86_64"
          binary_format/embed_pck=true
          texture_format/bptc=false
          texture_format/s3tc=false
          texture_format/etc=false
          texture_format/etc2=false
          '@ | Set-Content "export_presets.cfg" -Encoding ascii

          New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Export Windows game
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $godotPath = (Resolve-Path "./godot.exe").Path
          $stdout = Join-Path $PWD "godot-stdout.log"
          $stderr = Join-Path $PWD "godot-stderr.log"

          $arguments = '--headless --verbose --log-file "godot-export.log" --path "." --export-release "Windows Desktop" "build/DanielHills.exe"'

          Write-Host "Starting Godot export and waiting for completion..."

          $process = Start-Process `
            -FilePath $godotPath `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr

          $exitCode = $process.ExitCode
          Write-Host "Godot process exit code: $exitCode"

          foreach ($log in @($stdout, $stderr, (Join-Path $PWD "godot-export.log"))) {
            if (Test-Path $log) {
              Write-Host "========== $log =========="
              Get-Content $log
            }
          }

          if ($exitCode -ne 0) {
            throw "Godot export process failed with exit code $exitCode."
          }

          if (-not (Test-Path "build/DanielHills.exe")) {
            throw "Godot exited but build/DanielHills.exe was not created."
          }

          Get-Item "build/DanielHills.exe" |
            Select-Object FullName, Length

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Daniel-Hills-Windows-Prototype
          path: build/DanielHills.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daniel-Hills-Build-Logs
          path: |
            godot-export.log
            godot-stdout.log
            godot-stderr.log
          if-no-files-found: ignore
          retention-days: 7
