name: Build Daniel Hills Windows ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot" -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot" -Filter "*.exe" | Select-Object -First 1
          if (-not $godot) { throw "Godot executable not found." }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.tpz"
          New-Item -ItemType Directory -Force "$env:APPDATA/Godot/export_templates/4.4.1.stable" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/templates.tpz" "$env:RUNNER_TEMP/templates" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP/templates" -Directory -Recurse | Where-Object { $_.Name -eq "templates" } | Select-Object -First 1
          if ($root) {
            Copy-Item "$($root.FullName)/*" "$env:APPDATA/Godot/export_templates/4.4.1.stable/" -Recurse -Force
          } else {
            Copy-Item "$env:RUNNER_TEMP/templates/*" "$env:APPDATA/Godot/export_templates/4.4.1.stable/" -Recurse -Force
          }

      - name: Create export preset
        shell: pwsh
        run: |
          @'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/DanielHills.exe"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=false
          binary_format/64_bits=true
          binary_format/embed_pck=true
          texture_format/bptc=false
          texture_format/s3tc=true
          texture_format/etc=false
          texture_format/etc2=false
          '@ | Set-Content -Path "export_presets.cfg" -Encoding utf8

      - name: Import and export game
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "build" | Out-Null
          & "$env:GODOT_EXE" --headless --path "$PWD" --editor --quit
          if ($LASTEXITCODE -ne 0) { throw "Godot import step failed with code $LASTEXITCODE" }
          & "$env:GODOT_EXE" --headless --path "$PWD" --export-release "Windows Desktop" "build/DanielHills.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with code $LASTEXITCODE" }
          if (-not (Test-Path "build/DanielHills.exe")) { throw "Export did not create DanielHills.exe" }

      - name: Package ZIP
        shell: pwsh
        run: |
          Copy-Item "project.godot" "build/project.godot"
          Compress-Archive -Path "build/*" -DestinationPath "DanielHills-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanielHills-Windows
          path: DanielHills-Windows.zip
          if-no-files-found: error
